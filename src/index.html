<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src 'none'; connect-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta http-equiv="x-dns-prefetch-control" content="off" />
    <meta name="referrer" content="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>VersionBench — Version Benchmark</title>
    <meta
      name="description"
      content="A version-number benchmark for language models. Interactive release timelines, benchmark leaderboards, and comparisons with primary-source links."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231e40af'/%3E%3Cpath d='M7 23V18H13V12H20V7H25' fill='none' stroke='white' stroke-width='3'/%3E%3C/svg%3E"
    />
    <style>
      /* STYLES */
    </style>
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="#leaderboard" aria-label="VersionBench home"
          ><svg viewBox="0 0 28 28" aria-hidden="true">
            <rect width="28" height="28" rx="5" fill="currentColor" />
            <path d="M6 21v-5h6v-5h6V6h5" fill="none" stroke="white" stroke-width="2.5" /></svg
          ><span>Version<span class="brand-light">Bench</span></span></a
        >
        <nav aria-label="Main navigation">
          <a href="#leaderboard" data-nav="leaderboard">Leaderboard</a
          ><a href="#timeline" data-nav="timeline">Timeline</a
          ><a href="#compare" data-nav="compare"
            >Compare<span id="nav-count" class="nav-count">3</span></a
          ><a href="#releases" data-nav="releases">Release index</a>
        </nav>
        <span class="header-tag">LLM VERSION BENCHMARK</span>
      </div>
    </header>
    <main id="main" tabindex="-1"></main>
    <footer class="site-footer">
      <div>
        <strong>VersionBench</strong><span>Benchmark scores reflect model version numbers.</span>
      </div>
      <div><a href="#methodology">Methodology</a><span id="footer-date"></span></div>
    </footer>
    <div id="tooltip" class="tooltip" hidden></div>
    <dialog id="model-dialog" aria-labelledby="picker-title">
      <div class="dialog-head">
        <div>
          <span class="eyebrow">COMPARE RELEASES</span>
          <h2 id="picker-title">Select models</h2>
        </div>
        <button class="icon-button" id="close-picker" aria-label="Close model selector">×</button>
      </div>
      <div class="dialog-search">
        <label class="sr-only" for="model-search">Search models or families</label
        ><input
          id="model-search"
          type="search"
          placeholder="Search models or families…"
          autocomplete="off"
        /><label class="check-label"
          ><input id="latest-only" type="checkbox" /> Highest benchmark score per family</label
        >
      </div>
      <div id="picker-list" class="picker-list"></div>
      <div class="dialog-foot">
        <span id="picker-count" aria-live="polite"></span>
        <div>
          <button class="button" id="picker-clear">Clear</button
          ><button class="button primary" id="picker-done">Apply selection</button>
        </div>
      </div>
    </dialog>
    <script id="release-data" type="application/json">
      /* DATA */
    </script>
    <script id="stats-data" type="application/json">
      /* STATS */
    </script>
    <script id="pending-data" type="application/json">
      /* PENDING */
    </script>
    <script id="watch-data" type="application/json">
      /* WATCHLIST */
    </script>
    <script>
      /* SCRIPT */
    </script>
    <noscript
      ><p class="noscript">
        Enable JavaScript to explore the timeline, leaderboard, and comparisons. All release data is
        embedded in this HTML file.
      </p></noscript
    >
  </body>
</html>
